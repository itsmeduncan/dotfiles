# Global mise config — symlinked to ~/.config/mise/config.toml by install.sh.
#
# To upgrade a tool:
#   mise latest <tool>           # see what's available
#   # bump the version below, then:
#   mise install
#
# To upgrade everything to latest (and update this file):
#   mise upgrade --bump

[tools]
# Language runtimes
node    = "26.10.0"
python  = "3.14.8"
ruby    = "4.0.7"
go      = "1.27.1"
java    = "temurin-17.0.20+101"
bun     = "1.4.2"

# Editors
neovim  = "0.12.5"

# Modern CLI replacements
eza     = "0.23.5"
bat     = "0.26.1"
ripgrep = "15.2.0"
fd      = "10.5.0"
zoxide  = "0.10.0"
fzf     = "0.74.4"
delta   = "0.19.2"
direnv  = "2.37.1"

# Git / GitHub
gh      = "2.102.0"
lazygit = "0.65.1"
pre-commit = "4.6.2"

# Package managers / build tooling
uv      = "0.12.23"
pnpm    = "12.9.1"
just    = "1.58.0"

# Data tools
jq      = "1.8.2"
yq      = "4.54.1"

# Docs / markdown
glow    = "3.0.0" # terminal markdown renderer (aqua:charmbracelet/glow)

# Performance / inspection
hyperfine = "1.20.0"
dust    = "1.2.6"
bottom  = "0.14.9"
tokei   = "15.0.0"

# Cloud & infra
awscli    = { version = "2.37.9", symlink_bins = "true" }
terraform = "1.16.5"

# AI / agents
opencode  = "1.18.34"
"npm:@mariozechner/pi-coding-agent" = "0.73.1"

# Mobile
swiftlint = "0.65.1"

# Shell history
atuin   = "18.23.0"
