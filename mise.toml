# Global mise config — symlinked to ~/.config/mise/config.toml by install.sh.
#
# To upgrade a tool:
#   mise latest <tool>           # see what's available
#   # bump the version below, then:
#   mise install
#
# To upgrade everything to latest (and update this file):
#   mise upgrade --bump

[tools]
# Language runtimes
node    = "26.12.1"
python  = "3.14.8"
ruby    = "4.0.9"
go      = "1.27.3"
java    = "temurin-17.0.21+9"
bun     = "1.4.4"

# Editors
neovim  = "0.12.6"

# Modern CLI replacements
eza     = "0.23.5"
bat     = "0.26.1"
ripgrep = "15.2.0"
fd      = "10.5.0"
zoxide  = "0.10.0"
fzf     = "0.74.5"
delta   = "0.20.1"
direnv  = "2.38.2"

# Git / GitHub
gh      = "2.103.2"
lazygit = "0.66.2"
pre-commit = "4.7.0"

# Package managers / build tooling
uv      = "0.13.5"
pnpm    = "12.15.0"
just    = "1.59.0"

# Data tools
jq      = "1.8.2"
yq      = "4.54.1"

# Docs / markdown
glow    = "3.0.0" # terminal markdown renderer (aqua:charmbracelet/glow)

# Performance / inspection
hyperfine = "2.0.0"
dust    = "1.2.6"
bottom  = "0.14.9"
tokei   = "15.0.0"

# Cloud & infra
awscli    = { version = "2.38.5", symlink_bins = "true" }
terraform = "1.17.0"

# AI / agents
opencode  = "1.18.34"
"npm:@mariozechner/pi-coding-agent" = "0.73.1"

# Mobile
swiftlint = "0.65.1"

# Shell history
atuin   = "18.24.2"

[settings]
# Supply chain: like the 7-day gate for npm/pnpm/uv/bun, never install a tool
# version published less than 7 days ago (`mise upgrade --bump` included).
minimum_release_age = "7d"
