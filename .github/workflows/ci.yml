name: ci

# Two tiers:
# - tier1 (lint): always cheap; bash -n, shellcheck, shfmt, prettier check, json/yaml validation, gitleaks
# - tier2 (install): expensive; runs ./install.sh end-to-end on a clean macos-latest runner.
#                    Triggered on any pull request and on workflow_dispatch.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # Weekly: a fresh install breaks when upstream changes (a disabled Homebrew
  # formula, a moved plugin) even when this repo does not.
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  tier1-lint:
    name: Tier-1 lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          # gitleaks diffs BASE^..HEAD; needs full history.
          fetch-depth: 0

      - name: Install shellcheck + shfmt + zsh
        # Same versions as .pre-commit-config.yaml, so CI and the local hook agree.
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          curl -sSfL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ -C /tmp
          sudo install /tmp/shellcheck-v0.11.0/shellcheck /usr/local/bin/shellcheck
          curl -sSfL -o /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.13.0/shfmt_v3.13.0_linux_amd64
          sudo install /tmp/shfmt /usr/local/bin/shfmt

      - name: Shell lint (shellcheck, shfmt, zsh -n on every first-party script)
        run: bin/lint-shell

      - name: sync-main regression tests
        run: bash agents/skills/sync-main/test-sync-main.sh

      - name: JSON validation
        run: |
          # Every tracked first-party JSON file (vendored skills excluded).
          git ls-files '*.json' ':!:agents/skills/**' | while IFS= read -r f; do
            python3 -c "import json,sys;json.load(open(sys.argv[1]))" "$f"
            echo "ok: $f"
          done

      - name: Hook scripts behave
        run: bash claude/hooks/test-hooks.sh

      - name: .tool-versions in sync with mise.toml
        run: bin/sync-tool-versions --check

      - name: Prettier check (markdown)
        # Pin the exact version. An unpinned `prettier@3` lets a newer release
        # reformat markdown and break CI on unrelated commits. Keep this in sync
        # with the min-release-age-capped version used locally / by pre-commit.
        run: |
          npx --yes prettier@3.8.4 --check '**/*.{md,markdown,yaml,yml}' \
            '!agents/skills/**' '!claude/skills/**' '!CHANGELOG.md'

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin to the pre-commit rev. The action's default (8.24.3) ignores
          # the [[allowlists]] table in .gitleaks.toml, so CI and local hooks
          # disagreed on the vendored skill docs.
          GITLEAKS_VERSION: 8.30.0

  tier2-install:
    name: Tier-2 install (e2e on macOS)
    runs-on: macos-latest
    needs: tier1-lint
    # Every PR, every push to master (direct pushes skipped it before), the
    # weekly schedule, and manual dispatch.
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'push' ||
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Dry-run installer (catch wiring bugs cheaply)
        run: |
          ./install.sh --dry-run

      - name: Real installer (skip phases that need interactive input or root)
        # Skipped phases:
        # - macos:    needs sudo for firewall; not worth the runner perms grant
        # - ssh:      interactive prompt; not portable to CI
        # - android:  10+ min SDK download; gated by directory check
        # - runtimes: oh-my-zsh + rustup + tmux/nvim plugin sync — editor
        #             sugar, not core dotfiles bootstrap. Brittle in CI.
        env:
          # mise's aqua backend hits api.github.com per tool resolve; without a
          # token the unauthenticated rate limit (60/hr) is exhausted in seconds.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Any warning (a failed formula, a failed mise tool) fails the job.
          DOTFILES_CI: "1"
          # The runner has no SSH key for GitHub. Rewrite SSH URLs to HTTPS
          # through the environment: the symlinks phase replaces ~/.gitconfig,
          # so a `git config --global` rewrite would be lost mid-install.
          GIT_CONFIG_COUNT: "2"
          GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_0: "git@github.com:"
          GIT_CONFIG_KEY_1: url.https://github.com/.insteadOf
          GIT_CONFIG_VALUE_1: ssh://git@github.com/
        run: |
          ./install.sh --skip=macos,ssh,android,runtimes

      - name: Verify the install (--check exits 1 on any drift)
        run: |
          ./install.sh --check --skip=macos,ssh,android,runtimes
