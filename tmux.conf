# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded"

# --- Terminal / Ghostty ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -g allow-passthrough on
set -g set-clipboard on
set -g default-shell /bin/zsh

# --- Timing ---
set -s escape-time 0
set -g repeat-time 300
set -g display-time 2000

# --- Behavior ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g focus-events on
set -g history-limit 50000
set -g detach-on-destroy off

# --- Status bar ---
set -g status-position top
set -g status-interval 30
set -g status-style "fg=#808080,bg=#000000"
set -g status-left "#[fg=#c0c0c0,bold] #S "
set -g status-left-length 30
set -g status-right '#(~/.dotfiles/bin/weather) | #(pmset -g batt | grep -Eo "[0-9]+%%") | %H:%M '
set -g status-right-length 60

# Window tabs
setw -g window-status-format " #I:#W "
setw -g window-status-current-format "#[fg=#ffffff,bold] #I:#W "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#666666"

# --- Key bindings ---
# Splits (in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Arrow pane navigation (keep existing)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Join/break panes
bind S break-pane
bind J join-pane -h -t 1 -s 2

# --- Copy mode (vi) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'

run '~/.tmux/plugins/tpm/tpm'
