# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded"

# --- Terminal / Ghostty ---
set -g extended-keys on
set -g extended-keys-format csi-u
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"
set -g allow-passthrough on
set -g set-clipboard on
set -g default-shell /bin/zsh

# --- Timing ---
set -s escape-time 0
set -g repeat-time 300
set -g display-time 2000

# --- Behavior ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename off
set -g mouse on
set -g focus-events on
set -g history-limit 50000
set -g detach-on-destroy off

# --- Status bar ---
set -g status-position top
set -g status-interval 30
set -g status-style "fg=#707070,bg=#000000"
set -g status-left "#[fg=#000000,bg=#7a9f9f,bold] #S #[fg=#7a9f9f,bg=#000000,nobold]"
set -g status-left-length 30
set -g status-right '#[fg=#707070]#(~/.dotfiles/bin/weather) #[fg=#383838]│ #[fg=#707070]#(~/.dotfiles/bin/battery) #[fg=#383838]│ #[fg=#b0b0b0,bold]%b %d %H:%M '
set -g status-right-length 80

# Window tabs
setw -g window-status-format "#[fg=#585858] #I:#W "
setw -g window-status-current-format "#[fg=#7a9f9f,bold] #I:#W "
setw -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#1a1a1a"
set -g pane-active-border-style "fg=#484848"

# Messages and copy mode
set -g message-style "fg=#b0b0b0,bg=#000000"
set -g message-command-style "fg=#b0b0b0,bg=#000000"
setw -g mode-style "fg=#000000,bg=#7a9f9f"

# --- Key bindings ---
# Splits (in current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Smart pane navigation (vim-tmux-navigator)
# Uses pane_current_process (tmux 3.2+) instead of ps|grep for faster detection
is_vim="#{pane_current_process} =~ (g?(view|l?n?vim?x?|fzf)(diff)?|$)"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R

# Quick Claude Code pane (30% right split)
bind C split-window -h -p 30 -c "#{pane_current_path}"

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Quick window switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# Arrow pane navigation (keep existing)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Join/break panes
bind S break-pane
bind J join-pane -h -t 1 -s 2

# --- Copy mode (vi) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# --- Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
