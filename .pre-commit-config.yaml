# Pre-commit hooks for dotfiles repo.
#
# Install:    pre-commit install
# Run all:    pre-commit run --all-files
# Update:     pre-commit autoupdate
#
# Hooks chosen for a personal dotfiles + multi-AI-tool repo:
# - shellcheck:    lint install.sh + lib/*.sh
# - shfmt:         enforce shell formatting (matches editorconfig)
# - prettier:      keep markdown formatting consistent
# - gitleaks:      catch accidentally-committed secrets
# - standard:      whitespace, EOF, large files, merge conflicts

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-yaml
      - id: check-json
        exclude: ^(claude/skills/.*|\.vscode/)
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        # Every first-party script (bin/lint-shell, which CI runs, finds the same
        # set by shebang). Vendored agents/skills/ are not ours; sync-main is.
        files: ^(install\.sh|lib/.*\.sh|bin/[^/]+|claude/statusline\.sh|claude/hooks/.*\.sh|agents/skills/sync-main/.*\.sh)$
        exclude_types: [binary]
        # Follow `# shellcheck source=` directives (each lib/*.sh sources
        # _common.sh) so single-file commits don't false-positive on SC1091.
        args: [--external-sources]

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.13.0-1
    hooks:
      - id: shfmt
        args: ["-i", "2", "-ci", "-bn"]
        files: ^(install\.sh|lib/.*\.sh|bin/[^/]+|claude/statusline\.sh|claude/hooks/.*\.sh|agents/skills/sync-main/.*\.sh)$

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: \.(md|markdown|yaml|yml|json)$
        exclude: ^(agents/skills/|claude/skills/|config/nvim/lazy-lock\.json|CHANGELOG\.md)

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: tool-versions-sync
        name: .tool-versions matches mise.toml
        # CI fails when they drift; catch it before the commit instead.
        entry: bin/sync-tool-versions --check
        language: system
        files: ^(mise\.toml|\.tool-versions)$
        pass_filenames: false
