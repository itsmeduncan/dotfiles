# Tailnet hosts: this tailnet's MagicDNS names (*.tail1cf291.ts.net), the
# Tailscale address range 100.64.0.0/10 (written as 100.64.* .. 100.127.*,
# because ssh patterns have no CIDR form and 100.* would also match public
# addresses), and the short names agents use. Linked to ~/.ssh/config.d/tailnet.conf and included
# from the top of ~/.ssh/config, before any `Host *`: ssh keeps the FIRST value
# it gets for each keyword, so these settings win over the 1Password agent.
# Host-specific lines (IPs, HostName, User) stay in the untracked ~/.ssh/config.
#
# - On-disk key, never the 1Password agent: the agent locks mid-session and
#   then fails instead of falling back to IdentityFile.
# - One shared connection per host for 10 minutes: ~380 ms -> ~20 ms per
#   command, and one auth instead of one per command. The server's MaxSessions
#   (default 10) caps concurrent commands over one shared connection.
Host *.tail1cf291.ts.net darksaber scriptorium mini duncans-mac-mini
  IdentityAgent none
  IdentitiesOnly yes
  IdentityFile ~/.ssh/id_ed25519
  ControlMaster auto
  ControlPath ~/.ssh/cm-%C
  ControlPersist 10m
  ServerAliveInterval 30

Host 100.64.* 100.65.* 100.66.* 100.67.* 100.68.* 100.69.* 100.70.* 100.71.* 100.72.* 100.73.* 100.74.* 100.75.* 100.76.* 100.77.* 100.78.* 100.79.* 100.80.* 100.81.* 100.82.* 100.83.* 100.84.* 100.85.* 100.86.* 100.87.* 100.88.* 100.89.* 100.90.* 100.91.* 100.92.* 100.93.* 100.94.* 100.95.* 100.96.* 100.97.* 100.98.* 100.99.* 100.100.* 100.101.* 100.102.* 100.103.* 100.104.* 100.105.* 100.106.* 100.107.* 100.108.* 100.109.* 100.110.* 100.111.* 100.112.* 100.113.* 100.114.* 100.115.* 100.116.* 100.117.* 100.118.* 100.119.* 100.120.* 100.121.* 100.122.* 100.123.* 100.124.* 100.125.* 100.126.* 100.127.*
  IdentityAgent none
  IdentitiesOnly yes
  IdentityFile ~/.ssh/id_ed25519
  ControlMaster auto
  ControlPath ~/.ssh/cm-%C
  ControlPersist 10m
  ServerAliveInterval 30
